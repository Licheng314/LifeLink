openapi: 3.1.0
info:
  title: Life Link Context Sync API
  version: 1.15.5
  description: |
    Android、PC/Web 采集器与中央上下文服务之间的同步协议。
    所有时间均为 UTC ISO 8601（带 Z），持续时长单位为秒。
    v1.1 保持 /v1 路径和 v1 请求信封兼容，并增加逐事件确认与可选修订号。
    v1.2 增加使用独立只读凭据的中央设备与应用用量 MVP 查询。
    v1.3 增加使用短期一次性邀请凭据的远端 PC 在线配对端点。
    v1.4 增加中央生成的设备用量与位置 AI 上下文 Markdown 摘要端点。
    v1.5 增加黑名单规则中央统一管理，已注册设备凭据或只读凭据均可读取，已注册设备凭据可管理。
    v1.6 增加中央权威的跨日共享设置；只读凭据或已注册设备可读取，任一已注册设备可修改。
    v1.6.1 为不支持 PATCH 的 HTTPS 映射增加同语义 POST 更新入口；PATCH 继续兼容。
    v1.7 追加心愿、每日评估、时间线和触发器资源；不改变既有事件上传 ACK、跨日设置或黑名单语义。
    v1.7.1 为黑名单用量触发器增加全平台汇总范围，并约定晚间使用触发器以 device_id=all 表示全部设备；单平台黑名单规则的匹配语义不变。
    v1.7.2 约定新心愿从创建所在业务日开始计第 1 天；既有心愿的固定日期和跨日快照保持不变。
    v1.8.0 新增仅修改心愿文字的 PATCH 和任意状态 DELETE。删除由中央原子清除心愿生命周期数据与关联触发器，保留真实触发事实但解除索引，并以不含用户内容的最小墓碑阻止原创建请求的延迟重试复活心愿。
    v1.8.1 为会阻断 PATCH/DELETE 的 HTTPS 映射增加心愿与触发器 POST 兼容入口；标准 PATCH/DELETE 继续保留，PC 与 Android 默认使用 POST 兼容入口。
    v1.9.0 增加中央设备自定义名称与逻辑删除。稳定 device_id、原始事件和历史批次不变；删除会撤销凭据、隐藏当前设备并停用明确绑定该设备的用量触发器，重新接入必须使用新邀请。
    v1.10.0 增加健康信息读取与 Android 计步观察事件。睡眠参考由中央综合 PC/Android 明确交互动态估算；步数按 Android 设备和计数会话差分，不跨设备求和。
    v1.10.1 明确睡眠候选由醒后最早真实使用立即闭合，不等待中午；增加结果完成时刻、区间跨度和睡前/醒后边界设备。短暂夜间使用被后续证据合并时允许动态延伸结果。
    v1.10.2 为会阻断 PATCH 的 HTTPS 映射增加黑名单规则 POST 兼容更新入口；标准 PATCH 继续保留，PC 默认使用 POST 兼容入口。
    v1.10.3 为每台 Android 计步设备增加自然日 0–23 时的固定 24 项步数分布；每段增量完整归入后一个观察所在小时，不跨设备合计。
    v1.11.0 增加中央活动状态派生与主健康手机共享设置；活动区间按请求的业务日窗口融合主手机步数/位置与全部设备真实使用，不固化第二份事实。
    v1.11.1 为每个活动区间增加可空的代表地址与经纬度，便于 WebUI 解释定位证据；不改变原始定位事实或活动分类算法。
    v1.12.0 增加心愿手动完结入口：最后一个业务日结束且全部日期已评估后，用户可确认归档并生成结果事件；未处理时仍保留 72 小时自动终结。
    v1.13.0 增加中央事件背景摘要与 AI 理解说明读取、固定系统里程碑、心愿定时提醒和共享报告调度设置；报告只预留同一事件上的投送展示状态，不引入 AI 凭据、调用、重试或游标。
    v1.13.1 将设备使用系统里程碑改为按设备独立生成并只附带应用/网站合并 Top 5；背景实时设备与应用只返回 15 分钟内仍在线的设备并按设备相邻排列；心愿关联触发器在固定 ends_on 后立即停止。
    v1.13.2 修正固定系统晚睡在线检查为睡觉时间后每 30 分钟执行一次；新事件证据规则使用 late_online_half_hourly，旧事件保留 late_online_hourly 以便历史读取。
    v1.14.0 增加独立 AI reader 被动只读协议：短期 pairing token 一次领取长期只读凭据，背景全量、时间线事件按 reader/epoch/业务日不透明游标增量、理解说明按版本返回，并由注册设备管理 reader 和仅表示 served 的访问记录。跨日自动切换到当前业务日，首版不含人工重放/跳过积压、主动信号、Webhook、AI 写入或 WebUI。
    v1.15.0 增加 AI reader 内置管理与事件可见性：注册设备可生成本机配对文本、清理单个 reader 的当前读取进度；时间线动态标注当前 reader 是否已获得事件。AI 连接和成功提供上下文会生成低优先级审计事件，但这些审计事件永不进入 AI reader 响应。AI 显示名称由当前有效 reader 身份投影，不再允许手动修改。
    v1.15.1 将全部低优先级时间线事件排除在 AI reader 响应之外，并增加注册设备可用的无副作用“下一次读取原文”预览；预览遵循当前 reader 最新已签发游标，但不签发可用游标、不写访问记录、不推进标记。
    v1.15.3 固定个人模式只连接一个 AI：新 reader 成功领取时原子撤销其他 reader Token并保留历史审计；AI 上下文把 understanding 放在背景和事件之前，并允许同机 reader 在配对时保存不含完整路径和 PID 的稳定应用进程绑定。
    v1.15.4 为时间线读取增加 ETag 条件校验；内容未变化时返回无正文的 304，避免 PC 小窗与 WebUI 重复下载完整业务日数据。
    v1.15.5 增加周历业务日摘要读取；以共享跨日起点按互斥模块返回逻辑内容量，不改变认证、上传或 SQLite 数据。
servers:
  - url: https://{host}
    variables:
      host:
        default: context.example.com
paths:
  /v1/health:
    get:
      summary: 检查上下文服务状态
      operationId: getHealth
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/health-info:
    get:
      summary: 读取指定本地日期的中央健康参考信息
      operationId: getHealthInfo
      security:
        - readBearerAuth: []
        - registeredDeviceAuth: []
      parameters:
        - name: date
          in: query
          required: true
          description: 按共享 Asia/Shanghai 时区解释的醒来日/步数统计日。
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: 动态计算的睡眠参考与按 Android 设备拆分的步数（含后一个观察所在本地小时的 24 项分布）。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthInfoResponse'
        '400':
          description: date 缺失或不是严格 YYYY-MM-DD。
        '401':
          description: 缺少或无法识别的 Bearer Token。
  /v1/enrollments/claim:
    post:
      summary: 使用一次性邀请为一台远端 PC 申领长期客户端配置
      operationId: claimEnrollmentInvitation
      security:
        - invitationBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentClaim'
      responses:
        '200':
          description: |
            首次领取成功，或同一邀请、同一稳定 device_id 在响应丢失后的幂等重试。
            返回 life-radio-client-profile-v1；upload scope 必须省略 read_token。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifeRadioClientProfile'
        '400':
          description: 请求 schema、平台或设备身份格式不合法
        '401':
          description: 邀请 Token 无效、撤销、未知，或 invitation_id 与 Token 不匹配
        '409':
          description: invitation_already_claimed；该邀请已绑定到另一稳定 device_id
        '410':
          description: invitation_expired；邀请超过 expires_at，适用于首次领取和已领取同设备的幂等重试
        '429':
          description: 领取尝试过于频繁
        '503':
          description: 无法原子持久化绑定、长期凭据或热更新运行时鉴权；不返回部分配置
  /v1/ai-readers/pairings/claim:
    post:
      summary: Claim a long-lived passive AI reader credential with a short-lived pairing token.
      operationId: claimAIReaderPairing
      security:
        - aiReaderPairingAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIReaderPairingClaim'
      responses:
        '200':
          description: The long-lived access_token is returned exactly once. A lost response requires a new pairing; no management or retry endpoint can recover the plaintext token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReaderPairingClaimResponse'
        '400':
          description: The strict claim body or reader identity is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReaderError'
        '401':
          description: pairing_unauthorized; the pairing Token is invalid, unknown, revoked, or does not belong to pairing_id. The response never reveals pairing state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReaderError'
        '409':
          description: ai_reader_pairing_already_claimed; the one-time long-lived token has already been returned and cannot be recovered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReaderError'
        '410':
          description: ai_reader_pairing_expired; the short-lived pairing exceeded expires_at.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReaderError'
        '429':
          description: Pairing claim attempts are rate limited.
  /v1/ai-readers/pairings:
    post:
      summary: Generate one short-lived local AI reader pairing text.
      operationId: createAIReaderPairing
      security:
        - registeredDeviceAuth: []
      responses:
        '201':
          description: Returns one 24-hour, single-claim pairing artifact. It contains a secret pairing Token and must not be cached or logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReaderPairingCreateResponse'
        '401':
          description: Missing or invalid registered-device credential.
  /v1/read/ai/context:
    get:
      summary: Read the passive AI context as a full background plus incremental timeline events.
      description: |
        This endpoint returns only central projections approved for an AI reader. It never returns raw
        client collection events, raw GPS, credentials, SQLite data, or write capabilities. A successful
        response may be recorded as served, never as read, understood, displayed, or acknowledged by AI.
        Report prose remains frozen in TimelineEvent.evidence.body; delivery display state is not report prose.
      operationId: readAIContext
      security:
        - aiReaderAuth: []
      parameters:
        - $ref: '#/components/parameters/AIReaderBusinessDate'
        - $ref: '#/components/parameters/AIReaderCursor'
        - $ref: '#/components/parameters/AIReaderUnderstandingVersion'
        - $ref: '#/components/parameters/AIReaderView'
      responses:
        '200':
          description: Full or compact current background, current-business-day events after the reader-bound cursor (or the whole new business day after rollover), versioned understanding guidance, and a newly signed opaque cursor.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AIReaderContextResponse'
                  - $ref: '#/components/schemas/AIReaderCompactContextResponse'
        '400':
          description: invalid_cursor or invalid business_date/understanding_version. A malformed, tampered, or different-reader cursor is never treated as an empty page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReaderError'
        '401':
          description: invalid_ai_reader_token or ai_reader_token_expired; the AI reader Token is missing, invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReaderError'
        '409':
          description: cursor_superseded; the cursor belongs to an older cursor epoch after re-pairing or a user clear-reading-progress action and must not be accepted. The AI should discard it and retry once without cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReaderError'
        '410':
          description: cursor_expired; the opaque cursor exceeded its validity period and a cursorless read or reset is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReaderError'
  /v1/ai-readers:
    get:
      summary: List AI readers and their minimal passive-read state.
      operationId: listAIReaders
      security:
        - registeredDeviceAuth: []
      responses:
        '200':
          description: Reader identities and state only; access_token, Authorization, pairing text, and raw GPS are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReaderListResponse'
        '401':
          description: Missing or invalid registered-device credential.
  /v1/ai-readers/{reader_id}/access-logs:
    get:
      summary: List minimal served-response audit records for one AI reader.
      operationId: listAIReaderAccessLogs
      security:
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/AIReaderId'
      responses:
        '200':
          description: Records mean served only, never AI-read or understood; they contain no Token, Authorization, full pairing text, response body, database query, or raw GPS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReaderAccessLogListResponse'
        '401':
          description: Missing or invalid registered-device credential.
        '404':
          description: ai_reader_not_found.
  /v1/ai-readers/{reader_id}/process-status:
    get:
      summary: Detect the paired same-machine application process for one AI reader.
      operationId: getAIReaderProcessStatus
      security:
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/AIReaderId'
      responses:
        '200':
          description: True only when the reader's stable process binding matches a current Windows process; null means unbound or unverifiable and must be hidden by clients.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reader_id, process_running, process_display_name]
                properties:
                  reader_id:
                    type: string
                    format: uuid
                  process_running:
                    type: [boolean, 'null']
                  process_display_name:
                    type: [string, 'null']
        '401':
          description: Missing or invalid registered-device credential.
        '404':
          description: ai_reader_not_found.
  /v1/ai-readers/{reader_id}/context-preview:
    get:
      summary: Preview the next AI reader context without advancing its cursor.
      operationId: previewAIReaderContext
      security:
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/AIReaderId'
        - $ref: '#/components/parameters/AIReaderView'
      responses:
        '200':
          description: Uses the latest cursor issued in the reader's current epoch and previews the next compact context while always expanding the understanding guide for human inspection. It does not issue a usable cursor, write an access log, update reader state, or create an audit event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIReaderContextPreviewResponse'
        '400':
          description: invalid_ai_context_preview_request.
        '401':
          description: Missing or invalid registered-device credential.
        '404':
          description: ai_reader_not_found.
        '409':
          description: The selected reader is expired or revoked and cannot perform a next read.
  /v1/ai-readers/{reader_id}/clear-reading-progress:
    post:
      summary: Clear current served markers and make the AI reread the current business day.
      operationId: clearAIReaderProgress
      security:
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/AIReaderId'
      responses:
        '200':
          description: Increments cursor_epoch and clears current marker positions while retaining access logs. Existing opaque cursors return 409; a cursorless retry receives all eligible current-business-day events.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reader]
                properties:
                  reader:
                    $ref: '#/components/schemas/AIReader'
        '401':
          description: Missing or invalid registered-device credential.
        '404':
          description: ai_reader_not_found.
  /v1/ai-readers/{reader_id}:
    delete:
      summary: Revoke one AI reader credential.
      operationId: revokeAIReader
      security:
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/AIReaderId'
      responses:
        '204':
          description: The reader credential is revoked idempotently. Subsequent context reads return 401; timeline facts and minimal audit records remain.
        '401':
          description: Missing or invalid registered-device credential.
        '404':
          description: ai_reader_not_found.
  /v1/events/batches:
    post:
      summary: 上传一批上下文事件
      operationId: ingestEventBatch
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 与 batch_id 相同的 UUID；相同 key 的重试不得重复写入。
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
      responses:
        '200':
          description: |
            已处理；可部分接受。v1.1 客户端只将 confirmed_event_ids 中的事件
            标记为已送达；accepted_event_ids 仅为 v1.0 兼容字段。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAcknowledgement'
        '400':
          description: 请求格式或字段不合法
        '401':
          description: 缺失或无效的 Bearer Token
        '429':
          description: 上传过于频繁；客户端应按 Retry-After 重试
        '500':
          description: 临时服务端错误；客户端应保留本地队列后重试
  /v1/read/devices:
    get:
      summary: 查询一个 UTC 时间窗口内的中央设备概览
      operationId: readCentralDevices
      security:
        - readBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReadFrom'
        - $ref: '#/components/parameters/ReadTo'
        - $ref: '#/components/parameters/LocalDeviceId'
      responses:
        '200':
          description: |
            返回中央库中的设备及其窗口统计。last_seen_at 和 status 只描述最后一次
            成功同步的新鲜度，不证明设备当前联网或服务可访问。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadDevicesResponse'
        '400':
          description: from/to 缺失、不是 UTC Z 时间、from 不早于 to，或查询窗口不受支持
        '401':
          description: 缺失或无效的独立只读 Bearer Token
        '403':
          description: 凭据是设备上传 Token 或不具备中央读取权限
  /v1/read/usage:
    get:
      summary: 查询一个 UTC 时间窗口内的多设备应用使用聚合
      operationId: readCentralUsage
      security:
        - readBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReadFrom'
        - $ref: '#/components/parameters/ReadTo'
        - $ref: '#/components/parameters/LocalDeviceId'
      responses:
        '200':
          description: 返回足以代理为现有 PC /api/usage 响应的设备与总集聚合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadUsageResponse'
        '400':
          description: from/to 缺失、不是 UTC Z 时间、from 不早于 to，或查询窗口不受支持
        '401':
          description: 缺失或无效的独立只读 Bearer Token
        '403':
          description: 凭据是设备上传 Token 或不具备中央读取权限
  /v1/read/locations:
    get:
      summary: 查询位置事实与中央分钟级活动状态派生
      operationId: readCentralLocations
      security:
        - readBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReadFrom'
        - $ref: '#/components/parameters/ReadTo'
        - $ref: '#/components/parameters/LocalDeviceId'
      responses:
        '200':
          description: 保留既有位置观察/位置段，并增加按同一请求窗口动态计算的 activity_state。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadLocationsResponse'
        '400':
          description: from/to 无效或窗口超过 24 小时
        '401':
          description: 缺失或无效的独立只读 Bearer Token
        '403':
          description: 设备上传 Token 不具备 /v1/read/* 权限
  /v1/devices:
    get:
      summary: 列出当前未删除的中央设备及其用户名称
      operationId: listManagedDevices
      security:
        - readBearerAuth: []
        - registeredDeviceAuth: []
      responses:
        '200':
          description: 仅返回未逻辑删除的设备。display_name 始终为中央当前有效名称。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedDeviceListResponse'
        '401':
          description: 缺失或无效的只读或注册设备凭据
  /v1/devices/{device_id}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    patch:
      summary: 设置设备的中央自定义名称
      operationId: renameDevice
      security:
        - registeredDeviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceNamePatch'
      responses:
        '200':
          description: 更新后的中央设备记录；稳定 device_id 和客户端上报原名不变
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedDevice'
        '400':
          description: 请求体不严格或名称不是 1 至 100 个字符
        '401':
          description: 缺失或无效的注册设备凭据
        '404':
          description: device_not_found；设备不存在或已经逻辑删除
    post:
      summary: 通过传输兼容方法设置设备的中央自定义名称
      description: 与同路径 PATCH 完全等价，供阻断 PATCH 的 HTTPS 映射使用。
      operationId: renameDeviceViaPost
      security:
        - registeredDeviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceNamePatch'
      responses:
        '200':
          description: 与 PATCH 相同的中央最终记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedDevice'
        '400':
          description: 无效名称或请求体
        '401':
          description: 缺失或无效的注册设备凭据
        '404':
          description: device_not_found
    delete:
      summary: 逻辑删除设备并撤销其凭据
      operationId: retireDevice
      security:
        - registeredDeviceAuth: []
      responses:
        '204':
          description: |
            设备已逻辑删除，或同一删除请求已完成。原始事件、批次、稳定 device_id
            与历史设备名称保留；该设备凭据被撤销，明确绑定它的 device_usage_milestone
            触发器被停用。重新接入必须领取新邀请。
        '401':
          description: 缺失或无效的注册设备凭据
        '404':
          description: device_not_found
        '409':
          description: cannot_delete_current_device 或 credential_source_not_mutable
  /v1/devices/{device_id}/delete:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      summary: 通过传输兼容方法逻辑删除设备
      description: 与 DELETE /v1/devices/{device_id} 完全等价。
      operationId: retireDeviceViaPost
      security:
        - registeredDeviceAuth: []
      responses:
