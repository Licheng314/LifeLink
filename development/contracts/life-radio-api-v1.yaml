  /v1/wishes:
    get:
      summary: List central wishes, including archived history when requested.
      operationId: listWishes
      security:
        - readBearerAuth: []
        - registeredDeviceAuth: []
      parameters:
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Central authoritative wishes and their fixed wish_days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishListResponse'
        '401':
          description: Missing or invalid read or registered-device Bearer token.
    post:
      summary: Create a central wish and its fixed 3 or 7 business-day records.
      operationId: createWish
      security:
        - registeredDeviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishCreate'
      responses:
        '201':
          description: The central final record, including settings snapshot and all fixed wish_days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wish'
        '400':
          description: Invalid wish text or duration.
        '401':
          description: Missing or invalid registered-device Bearer token.
        '409':
          description: unarchived_wish_limit_reached, or idempotency_conflict when request_id is retried with a different normalized body; central transaction keeps at most three unarchived wishes. A request_id retained by a deletion tombstone still returns idempotency_conflict for a different normalized body.
        '410':
          description: wish_deleted; a delayed retry whose request_id and normalized body match a deleted wish's original creation request never recreates that wish.
  /v1/wishes/{wish_id}:
    get:
      summary: Read one central wish and its daily records.
      operationId: getWish
      security:
        - readBearerAuth: []
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/WishId'
      responses:
        '200':
          description: Central authoritative wish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wish'
        '401':
          description: Missing or invalid read or registered-device Bearer token.
        '404':
          description: wish_not_found.
    patch:
      summary: Update only the text of one central wish.
      operationId: updateWishText
      security:
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/WishId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishTextPatch'
      responses:
        '200':
          description: Central final wish. Text updates are allowed for active, cancelled, and archived wishes. The text mutation itself does not change fixed days, results, snapshots, trigger configuration, or timeline events; the existing due-wish lazy finalization still runs before this write and may independently archive an overdue wish and append wish.period_completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wish'
        '400':
          description: Invalid body, including a body that is not exactly the required text field or text outside the normalized 1..30 Unicode character limit.
        '401':
          description: Missing or invalid registered-device Bearer token.
        '404':
          description: wish_not_found.
    post:
      summary: Update only the text of one central wish through the transport-compatible method.
      description: Semantically identical to PATCH on this path. Clients use POST when the deployed HTTPS mapping rejects PATCH.
      operationId: updateWishTextViaPost
      security:
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/WishId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishTextPatch'
      responses:
        '200':
          description: Central final wish; identical to the PATCH response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wish'
        '400':
          description: Invalid text-only body.
        '401':
          description: Missing or invalid registered-device Bearer token.
        '404':
          description: wish_not_found.
    delete:
      summary: Permanently delete one central wish in any lifecycle state.
      operationId: deleteWish
      security:
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/WishId'
      responses:
        '204':
          description: |-
            Deletion completed, or this wish was already deleted and is represented by its deletion tombstone. The central transaction deletes the wish, its fixed wish_days, its associated event_triggers, and pure wish lifecycle timeline events (wish.created, wish.cancelled, wish.period_completed, wish.result_revised). It retains real trigger events as historical facts but atomically sets their wish_id and trigger_id to null; original device events are never changed. The tombstone retains only wish_id, the original creation request_id and normalized-body identity, and deleted_at—never wish text, fixed dates, assessments, trigger configuration, or timeline content. A same request_id plus same normalized creation body is rejected later by POST /v1/wishes with 410 wish_deleted, while a different body remains 409 idempotency_conflict; neither path can recreate the wish.
        '401':
          description: Missing or invalid registered-device Bearer token.
        '404':
          description: wish_not_found; no current wish or deletion tombstone exists for this ID.
  /v1/wishes/{wish_id}/delete:
    post:
      summary: Permanently delete one central wish through the transport-compatible method.
      description: Semantically identical to DELETE /v1/wishes/{wish_id}. Clients use this POST path when the deployed HTTPS mapping rejects DELETE.
      operationId: deleteWishViaPost
      security:
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/WishId'
      responses:
        '204':
          description: Deletion completed, or this wish was already deleted and has a tombstone; response body is empty.
        '401':
          description: Missing or invalid registered-device Bearer token.
        '404':
          description: wish_not_found; no current wish or deletion tombstone exists for this ID.
  /v1/wishes/{wish_id}/complete:
    post:
      summary: Manually complete and archive an expired wish.
      description: After the final wish business day has ended, a registered device may explicitly complete the wish only when every fixed wish day has a manual evaluation. Central atomically appends one wish.period_completed event, archives the wish, and disables its linked trigger. Repeating the request for the already archived wish returns the current record without another event. This does not replace the 72-hour automatic fallback.
      operationId: completeWish
      security:
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/WishId'
      responses:
        '200':
          description: Central final archived wish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wish'
        '401':
          description: Missing or invalid registered-device Bearer token.
        '404':
          description: wish_not_found.
        '409':
          description: wish_not_completable when the final business day has not ended or the wish is cancelled; wish_days_incomplete includes missing_business_dates when one or more fixed days still have null evaluation.
  /v1/wishes/{wish_id}/cancel:
    post:
      summary: Cancel an unarchived wish without deleting it or its daily records.
      operationId: cancelWish
      deprecated: true
      security:
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/WishId'
      responses:
        '200':
          description: Legacy compatibility only; new clients must use DELETE /v1/wishes/{wish_id} after an explicit permanent-delete confirmation. This endpoint returns the central final cancelled and archived wish; cancellation releases one unarchived slot. Repeating cancellation for this same cancelled wish returns this current final record with 200; only a normally archived (not cancelled) wish returns 409 wish_not_cancellable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wish'
        '401':
          description: Missing or invalid registered-device Bearer token.
        '404':
          description: wish_not_found.
        '409':
          description: wish_not_cancellable; the wish is normally archived rather than cancelled.
  /v1/wishes/{wish_id}/days/{business_date}:
    put:
      summary: Manually create or revise the assessment for one reached wish day.
      operationId: assessWishDay
      security:
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/WishId'
        - $ref: '#/components/parameters/BusinessDate'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishDayAssessment'
      responses:
        '200':
          description: Central final daily record. Historical revisions are allowed, including after archive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishDay'
        '400':
          description: Invalid assessment body or business_date outside this wish's fixed days.
        '401':
          description: Missing or invalid registered-device Bearer token.
        '404':
          description: wish_not_found or wish_day_not_found.
        '409':
          description: future_wish_day; a future business date cannot be assessed.
  /v1/timeline-events:
    get:
      summary: Read user-facing central timeline events in stable reverse chronological order.
      operationId: listTimelineEvents
      security:
        - readBearerAuth: []
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/ReadFrom'
        - $ref: '#/components/parameters/ReadTo'
        - $ref: '#/components/parameters/TimelineCategory'
        - $ref: '#/components/parameters/TimelineWishId'
        - $ref: '#/components/parameters/TimelineImportance'
        - name: If-None-Match
          in: header
          required: false
          description: Previously returned timeline ETag for private conditional revalidation.
          schema:
            type: string
      responses:
        '200':
          description: Ordered by occurred_at DESC, timeline_event_id DESC. This endpoint deliberately has no cursor.
          headers:
            ETag:
              description: Quoted SHA-256 of UTF-8 canonical JSON (sorted object keys, compact separators, Unicode preserved) for the complete response projection.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineEventListResponse'
        '304':
          description: If-None-Match matched the current timeline representation; response body is empty.
          headers:
            ETag:
              description: The unchanged strong content version.
              schema:
                type: string
        '400':
          description: Invalid UTC Z range, range order, or filter value.
        '401':
          description: Missing or invalid read or registered-device Bearer token.
