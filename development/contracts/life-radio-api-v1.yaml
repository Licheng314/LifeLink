  /v1/event-background:
    get:
      summary: Read the central event-page background summary and AI understanding guidance for one business day.
      operationId: getEventBackground
      security:
        - readBearerAuth: []
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: |
            A dynamic, read-only central projection for the requested Life Link business day. It includes
            only facts available at generated_at. It retains the latest real-time background entry for WebUI
            even when stale, marking it with is_stale and its observed_at; only entries with include_in_ai=true
            may enter an AI background. This resource neither creates timeline events nor
            stores an AI cursor, credentials, provider, model, or delivery retry state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventBackgroundResponse'
        '400':
          description: Invalid business_date.
        '401':
          description: Missing or invalid read or registered-device Bearer token.
  /v1/calendar-days:
    get:
      summary: Read logical central content sizes for inclusive Life Link business dates.
      operationId: listCalendarDays
      description: |
        Returns at most 42 inclusive business dates using the central shared timezone and day_start_hour.
        total_bytes is logical UTF-8 content, not SQLite file size: each raw event counts only its canonical
        event_json once; timeline rows count their stable user-readable persisted fields and JSON fields.
        Modules are mutually exclusive: app.foreground, web.foreground, and device.input_state are usage;
        location.* is location; health.* is health; timeline_events is timeline; every other raw event is other.
      security:
        - readBearerAuth: []
        - registeredDeviceAuth: []
      parameters:
        - $ref: '#/components/parameters/CalendarFrom'
        - $ref: '#/components/parameters/CalendarTo'
      responses:
        '200':
          description: Ordered inclusive from business date to business date; total_bytes equals the sum of all five module byte values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarDaysResponse'
        '400':
          description: Invalid, reversed, repeated, missing, or more-than-42-day date range.
        '401':
          description: Missing or invalid read or registered-device Bearer token.
